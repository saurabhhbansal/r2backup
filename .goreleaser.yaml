version: 2
project_name: r2backup

before:
  hooks:
    - go mod download

builds:
  - id: r2b
    main: ./cmd/r2b
    binary: r2b
    env:
      # No cgo, so every target cross-compiles from one Linux runner and the
      # result is a single static file with no runtime to install. That is the
      # entire distribution story: no installer, no Python, no Node.
      - CGO_ENABLED=0
    goos: [linux, windows, darwin]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{.Version}}
    mod_timestamp: "{{ .CommitTimestamp }}"

  # Windows only: the launcher that gives a scheduled run no console window.
  # -H=windowsgui makes it a GUI-subsystem binary, so Windows allocates no
  # console for it at all -- which is the only way to not have one, since a
  # console binary gets its console from the loader before any of its code
  # runs. See cmd/r2bw. It carries no version because it has no logic to
  # go stale: it runs whichever r2b.exe sits beside it.
  - id: r2bw
    main: ./cmd/r2bw
    binary: r2bw
    env:
      - CGO_ENABLED=0
    goos: [windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -H=windowsgui
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: default
    # Both builds. On Linux and macOS only r2b exists, so this is the
    # same single-binary archive it always was; a Windows archive gains the
    # launcher beside it.
    ids: [r2b, r2bw]
    # Windows archives hold two files and the others hold one, which
    # goreleaser refuses by default as a likely packaging mistake. Here it is
    # the intent: only Windows has a console window to avoid, so only Windows
    # ships the launcher that avoids it.
    allow_different_binary_count: true
    # The name the updater looks for. internal/selfupdate.AssetName builds the
    # same string; if these two ever disagree, `r2b update` stops finding its
    # own releases. It keeps the product's name, not the command's: it is
    # matched by every already-installed copy, and renaming it would strand
    # them all on the version they are running.
    name_template: "r2backup_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE

checksum:
  name_template: checksums.txt
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^test:"
      - "^chore:"

release:
  draft: false
  prerelease: auto
  # The per-release highlights come from .github/release-notes/<tag>.md, which
  # the workflow passes with --release-header. That file is the only place a
  # release's "what's new" is written; this header is the fallback for a build
  # that has none, so a release never goes out with an empty top.
  header: |
    ## r2backup {{ .Version }}

    Back up folders to Cloudflare R2 and restore them anywhere. One static
    binary, no installer, no background service.

    Run `r2b` on its own for the full interface, or use any command directly.

  extra_files:
    - glob: ./scripts/install.sh
    - glob: ./scripts/install.ps1
