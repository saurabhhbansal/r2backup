name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  GOTOOLCHAIN: local
  R2BACKUP_REQUIRE_FULL_SUITE: "1"

jobs:
  # A tag must not ship an installer whose tests were never run. This gate is
  # the whole reason the release job is two jobs.
  verify:
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - run: go vet ./...
      # -timeout is explicit because Go's default is 600s PER PACKAGE, and
      # test/e2e on Windows under -race sits right on that line:
      # TestTwentyThousandFileTree alone is ~485s there. A release was blocked
      # by it after CI had passed on the same commit minutes earlier, which is
      # what an implicit limit sitting a few seconds away from the truth looks
      # like. 20m is well inside every job's timeout-minutes.
      - run: go test ./... -race -count=1 -timeout 20m

  # The expensive, credential-gated one. MinIO and real R2 disagree about
  # multipart limits and error shapes, which is exactly what a release is the
  # last chance to catch -- so this runs before publishing and never on a
  # commit. It needs four repository secrets; without them it says so and the
  # release still goes out, because blocking every release on credentials
  # nobody has set is worse than a loud skip.
  realr2:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - name: Real R2 suite
        env:
          R2BACKUP_TEST_ACCOUNT_ID: ${{ secrets.R2BACKUP_TEST_ACCOUNT_ID }}
          R2BACKUP_TEST_ACCESS_KEY_ID: ${{ secrets.R2BACKUP_TEST_ACCESS_KEY_ID }}
          R2BACKUP_TEST_SECRET_ACCESS_KEY: ${{ secrets.R2BACKUP_TEST_SECRET_ACCESS_KEY }}
          R2BACKUP_TEST_BUCKET: ${{ secrets.R2BACKUP_TEST_BUCKET }}
        run: |
          if [ -z "$R2BACKUP_TEST_BUCKET" ]; then
            echo "::warning title=Real R2 suite skipped::Set the R2BACKUP_TEST_* repository secrets to run this before a release."
            exit 0
          fi
          go test -tags realr2 ./test/r2/... -count=1 -v -timeout 25m

  release:
    # realr2 as well as verify: with the secrets unset it succeeds with a
    # warning and the release goes out, but if it actually runs and fails,
    # nothing gets published. A tag must not ship a build that real R2
    # rejected.
    needs: [verify, realr2]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      # The tag's own highlights, if they were written. goreleaser refuses a
      # --release-header pointing at a file that is not there, so this
      # resolves to nothing when a release has no notes and the header in
      # .goreleaser.yaml is used instead.
      - name: Find this tag's release notes
        id: notes
        shell: bash
        run: |
          file=".github/release-notes/${GITHUB_REF_NAME}.md"
          if [ -f "$file" ]; then
            echo "args=--release-header=$file" >> "$GITHUB_OUTPUT"
            echo "Using $file as the release header."
          else
            echo "args=" >> "$GITHUB_OUTPUT"
            echo "No $file; falling back to the header in .goreleaser.yaml."
          fi

      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean ${{ steps.notes.outputs.args }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
