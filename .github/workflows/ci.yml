name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Pushing twice kills the first run rather than paying for both.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GOTOOLCHAIN: local
  R2BACKUP_REQUIRE_FULL_SUITE: "1"
  # Registers a real scheduled task on the runner and removes it again.
  # Everything about the schedulers was tested as generated strings, and all
  # of it passed while `schedule --every 5` failed outright on a real Windows
  # desktop -- nothing had ever called schtasks. The runners are ephemeral, so
  # this is the cheapest place in the world to actually try it.
  R2BACKUP_TEST_SCHEDULER: "1"

jobs:
  # Feature branches get Linux only. Windows bills at 2x and macOS at 10x, so
  # the full matrix is reserved for main and for tags.
  quick:
    if: github.ref != 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - run: go vet ./...
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "not gofmt'd:"; echo "$unformatted"; exit 1
          fi
      # -timeout is explicit because Go's default is 600s PER PACKAGE, and
      # test/e2e on Windows under -race sits right on that line:
      # TestTwentyThousandFileTree alone is ~485s there. A release was blocked
      # by it after CI had passed on the same commit minutes earlier, which is
      # what an implicit limit sitting a few seconds away from the truth looks
      # like. 20m is well inside every job's timeout-minutes.
      - run: go test ./... -race -count=1 -timeout 20m

  # main and PRs into it get all three platforms.
  matrix:
    if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # Raised from 25. The Windows leg runs ~9-13 minutes and the e2e package
    # alone can approach 12 of them under -race; the old margin was set to
    # conserve private-repo minutes, and the repo is public now, so Actions
    # are free. A budget that tight buys nothing and costs a blocked release.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - run: go vet ./...
      - name: gofmt
        if: matrix.os == 'ubuntu-latest'
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "not gofmt'd:"; echo "$unformatted"; exit 1
          fi
      # A skipped test is a failed build. Nothing quietly does-not-run.
      # -timeout is explicit because Go's default is 600s PER PACKAGE, and
      # test/e2e on Windows under -race sits right on that line:
      # TestTwentyThousandFileTree alone is ~485s there. A release was blocked
      # by it after CI had passed on the same commit minutes earlier, which is
      # what an implicit limit sitting a few seconds away from the truth looks
      # like. 20m is well inside every job's timeout-minutes.
      - name: Test
        run: go test ./... -race -count=1 -v -timeout 20m

  # Proves the binaries every platform ships actually compile, from one runner.
  cross-compile:
    if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        target:
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
          - { goos: linux,   goarch: amd64 }
          - { goos: linux,   goarch: arm64 }
          - { goos: darwin,  goarch: amd64 }
          - { goos: darwin,  goarch: arm64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - env:
          GOOS: ${{ matrix.target.goos }}
          GOARCH: ${{ matrix.target.goarch }}
          CGO_ENABLED: "0"
        run: go build ./...
